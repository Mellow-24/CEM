# CEM public-browser deployment overlay.
#
# The Web bundle keeps speech routes loopback-only. Public browsers may use
# them only after the reverse proxy supplies HTTPS and authentication and the
# launch command adds the public authority through --trusted-host.
- id: speech-web
  config:
    authority: trusted-host
    call:
      defaultGreeting: yue-Hant-MO
      synthesisProfile: macau-customer-service
      fallbackSynthesisProfile: macau-customer-service-fallback
      responseInstructions: |-
        当前客户正在实时电话通话，回复会由语音合成直接播报。继续遵守既有事实、知识证据和安全要求，并按以下方式回答：
        回复语言和字形必须严格服从系统的 response-language policy，并在每次知识检索后继续遵守。当前客服只提供澳门粤语和英文：系统选择 en 时使用英文；其他情况一律使用繁体字澳门粤语，即使客户使用普通话、简体字、葡文或混合语言提问也不得改用普通话或葡文。不要根据默认粤语开场白、历史回复或知识资料的语言自行切换。像真人接线客服一样自然说话，先直接回答客户最关心的结论，不复述问题，不说“根据资料”或“以下是”。
        只输出适合直接朗读的纯文本短句，所有句子连续写在同一段，不要换行。不要使用标题、Markdown、项目符号、编号、表格、链接、emoji、引用标记或证据编号。只保留自然停顿所需的逗号、句号和问号，避免括号、冒号、分号、斜线及连续标点。
        默认回答两到三个短句，粤语不超过九十字，英文不超过五十个词。知识检索返回多项信息时，只说与当前问题最相关的两到三个要点。流程较长时，先说明客户现在要做的第一步，再问是否需要继续，不要一次读完整套流程。
      greetings:
        yue-Hant-MO: { text: '你好，我係澳電智能客服，請問有咩可以幫到你？', asset: '@deepseek-ai/dsh-speech-web/greetings/yue.wav' }
        yue-Hant-HK: { text: '你好，我係澳電智能客服，請問有咩可以幫到你？', asset: '@deepseek-ai/dsh-speech-web/greetings/yue.wav' }
        zh-Hans: { text: '您好，请问有什么可以帮您？', asset: '@deepseek-ai/dsh-speech-web/greetings/zh.wav' }
        zh-Hant: { text: '您好，請問有什麼可以幫您？', asset: '@deepseek-ai/dsh-speech-web/greetings/zh.wav' }
        en: { text: 'Hello, how can I help you?', asset: '@deepseek-ai/dsh-speech-web/greetings/en.wav' }
        pt: { text: 'Olá, em que posso ajudar?', asset: '@deepseek-ai/dsh-speech-web/greetings/pt.wav' }
      playbackRate: 1.15
      microphone:
        echoCancellation: true
        noiseSuppression: true
        autoGainControl: false
      maxPendingAudioMs: 8000
      utteranceMergeMs: 850
      interruption:
        confirmationMs: 420
        minimumMeaningfulCharacters: 3
        echoMinimumCharacters: 6
        echoSimilarityThreshold: 0.82
        backchannelMaximumCharacters: 6
      responseTimeoutMs: 180000
      sentenceMaxChars: 160
      sentenceQueueLimit: 32
