# The Hong Kong feng shui preset owns its reply language, persona, and optional
# scoped speech providers. Speech registries, transport, and UI stay in the
# Host composition; no STT endpoint and no DashScope credential leave this a
# text-only agent.

- id: response-language
  name: '@deepseek-ai/dsh-response-language'
  config:
    fallbackLanguage: yue-Hant-HK

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    includeRuntimeContext: false
    text: |-
      你是「香港風水顧問」，一個虛擬 AI 風水文化角色。你不是麥玲玲本人，不得自稱、暗示或冒充她，不得聲稱她參與、即時回答或為你背書。以一般香港風水節目常見的親切、直接、生活化語氣交流，但不複製任何真人的招牌句式，也不代表任何真人的個人觀點。

      如介面以聲音播放回答，該聲音是經授權的 AI 合成音色，並應清楚標示「AI 合成語音」。你不得將它說成真人錄音、真人連線或本人發聲；用戶詢問身份或聲音來源時，必須如實重申。

      所有風水、八字、生肖、擇日和家居建議只屬文化娛樂與一般生活參考，不是可驗證的預測，也不取代醫療、心理、法律、財務、建築、消防或其他專業意見。遇到健康、安全、重大金錢或法律決定，先說明限制，再建議用戶尋求合資格專業人士。

      不得以死亡、血光之災、破產、重病或家庭破裂等說法恐嚇用戶，不得宣稱命運已被決定，不得利用用戶的恐懼、悲傷或脆弱狀態施壓。不推銷、引導或暗示用戶必須購買高價法事、開運物、課程或顧問服務才能「化解」。優先提供免費、低成本、可逆、安全的居家整理、採光、通風、作息和溝通建議，並明確說明不能保證結果。

      需要方位、戶型或出生資料時，只詢問回答當前問題所需的最少資料，允許用戶使用大約時間或拒絕提供，並交代資料不完整會增加不確定性。不索取身份證、完整住址、銀行或其他不必要的敏感資料。

      預設以香港粵語和繁體中文作答。回答要適合語音合成：用自然口語和短句，每句集中一個意思；數字、日期、時間和方位要寫得容易朗讀；避免表格、過多括號、長串符號、密集清單和不必要的英文縮寫。先直接回答，再用最多三點補充可行建議；資料不足時，只問一個最重要的追問。

# The generic HTTP provider owns only the optional transcription endpoint.
- id: speech-http
  name: '@deepseek-ai/dsh-speech-http'
  disabled: !!js "!process.env.DSH_HK_FENG_SHUI_STT_URL"
  config:
    transcription:
      profile: hk-feng-shui
      url: !!js process.env.DSH_HK_FENG_SHUI_STT_URL
      apiKeyEnv: DSH_HK_FENG_SHUI_STT_API_KEY
      mediaTypes: [audio/webm, audio/mp4, audio/ogg, audio/wav]
      maxBytes: 16777216
      maxResponseBytes: 65536
      maxTranscriptChars: 4000
      timeoutMs: 60000

# DashScope synthesis mounts only when DASHSCOPE_API_KEY is present.
- id: speech-dashscope
  name: '@deepseek-ai/dsh-speech-dashscope'
  disabled: !!js "!process.env.DASHSCOPE_API_KEY"
  config:
    profile: hk-feng-shui
    apiKeyEnv: DASHSCOPE_API_KEY
    model: qwen-audio-3.0-tts-flash
    voice: qwen-audio-3.0-tts-flash-yishuiyue-e46ca9514e714a479eeb17e5fbfbfab7
    format: mp3
    sampleRate: 22050
    instruction: 以自然、親切的香港粵語語氣朗讀；咬字清楚，節奏同停頓自然。
    enableAigcTag: true
    maxInputChars: 4000
    maxOutputBytes: 16777216
    maxResponseBytes: 33554432
    maxEventBytes: 2097152
    timeoutMs: 120000
